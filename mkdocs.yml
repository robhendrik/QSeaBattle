site_name: QSeaBattle Specification
site_description: Living specification for the QSeaBattle project.
site_author: Rob Hendriks

docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search

# MathJax for LaTeX-style math in Markdown.
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Algorithms: algorithms.md

  - Game:
      - Game: game.md
      - GameLayout: game_layout.md
      - GameEnv: game_env.md
      - Gameplay Adapters: gameplay_adapters.md
      - Tournament: tournament.md
      - TournamentLog: tournament_log.md

  - Players:
      - Base:
          - Players: players_base.md
          - PlayerA: player_base_a.md
          - PlayerB: player_base_b.md
      - Simple:
          - SimplePlayers: simple_players.md
          - SimplePlayerA: simple_player_a.md
          - SimplePlayerB: simple_player_b.md
      - Majority:
          - MajorityPlayers: majority_players.md
          - MajorityPlayerA: majority_player_a.md
          - MajorityPlayerB: majority_player_b.md
      - Neural Net:
          - NeuralNetPlayers: neural_net_players.md
          - NeuralNetPlayerA: neural_net_player_a.md
          - NeuralNetPlayerB: neural_net_player_b.md
      - PR Assisted:
          - PRAssistedPlayers: pr_assisted_players.md
          - PRAssistedPlayerA: pr_assisted_player_a.md
          - PRAssistedPlayerB: pr_assisted_player_b.md
      - Trainable Assisted:
          - TrainableAssistedPlayers: trainable_assisted_players.md
          - TrainableAssistedPlayerA: trainable_assisted_player_a.md
          - TrainableAssistedPlayerB: trainable_assisted_player_b.md

  - Shared Resources:
      - PR Assisted: pr_assisted.md
      - PR Assisted Replay: pr_assisted_replay.md

  - Linear Models:
      - Trainable Assisted Model A: lin_trainable_assisted_model_a.md
      - Trainable Assisted Model B: lin_trainable_assisted_model_b.md
      - Internal Model A: lin_internal_model_a.md
      - Internal Model B: lin_internal_model_b.md
      - Combine Layer A: lin_combine_layer_a.md
      - Combine Layer B: lin_combine_layer_b.md
      - Measurement Layer A: lin_measurement_layer_a.md
      - Measurement Layer B: lin_measurement_layer_b.md

  - Pyramidal Models:
      - Internal Model A: pyr_internal_model_a.md
      - Internal Model B: pyr_internal_model_b.md
      - Combine Layer A: pyr_combine_layer_a.md
      - Combine Layer B: pyr_combine_layer_b.md
      - Measurement Layer A: pyr_measurement_layer_a.md
      - Measurement Layer B: pyr_measurement_layer_b.md

  - Dataset Utilities:
      - Linear Dataset Generation: lin_dataset_generation_utilities.md
      - Linear Dataset Conversion: lin_dataset_conversion_utilities.md
      - Pyramidal Dataset Generation: pyr_dataset_generation_utilities.md
      - Pyramidal Dataset Conversion: pyr_dataset_conversion_utilities.md

  - Utilities:
      - Reference Performance: reference_performance_utilities.md
      - Neural Net Imitation: neural_net_imitation_utilities.md
      - DRU Utilities: dru_utilities.md
      - Logit Utilities: logit_utilities.md
